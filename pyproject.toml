[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-model-failure-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.6","torchvision>=0.21","timm>=1.0","numpy>=2","Pillow>=11","PyYAML>=6","pandas>=2","scikit-learn>=1.6","streamlit>=1.40","plotly>=6", "matplotlib>=3.10", "imageio>=2.37", "imageio-ffmpeg>=0.6"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
failure-lab = "failure_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


